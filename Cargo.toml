[workspace]
resolver = "2"
members = ["crates/hy-core", "crates/hy-extras", "crates/hy-app"]

[workspace.package]
version = "0.3.8"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
async-trait = "0.1"
bytes = "1"
thiserror = "2"
rand = "0.8"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
ring = "0.17"
http = "1"
blake2 = "0.10"
lru = "0.12"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
quinn-proto = { path = "vendor/quinn-proto" }
