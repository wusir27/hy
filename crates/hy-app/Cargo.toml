[package]
name = "hy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hysteria 2 CLI"

[[bin]]
name = "hy"
path = "src/main.rs"

[dependencies]
hy-core = { path = "../hy-core" }
hy-extras = { path = "../hy-extras" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring", "rcgen"] }
rustls.workspace = true
rcgen = "=0.14.7"
rustls-pemfile.workspace = true
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
