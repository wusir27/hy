[package]
name = "hy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hysteria 2 CLI"

[[bin]]
name = "hy"
path = "src/main.rs"

[dependencies]
hy-core = { path = "../hy-core" }
hy-extras = { path = "../hy-extras" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
